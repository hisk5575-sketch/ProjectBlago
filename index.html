<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>БЛАГО 2026 | THE BEST EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #f3cf8a; --wine: #5c0a0a; --dark: #050505; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color:transparent; }
        
        body { background: var(--dark); color: #fff; height: 100vh; overflow: hidden; position: fixed; width: 100vw; }

        /* Фон: Живое бордовое сияние */
        .bg-glow { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% -10%, var(--wine) 0%, var(--dark) 80%); }
        .bg-glow::after { content: ''; position: absolute; inset: 0; background: url('https://www.transparenttextures.com/patterns/stardust.png'); opacity: 0.2; }

        /* Золотая пыль */
        .dust { position: absolute; background: var(--gold); border-radius: 50%; opacity: 0.4; pointer-events: none; animation: float linear infinite; }
        @keyframes float { from { transform: translateY(105vh) scale(1); } to { transform: translateY(-10vh) scale(1.5); } }

        /* Пульсирующий заголовок */
        .brand-title { 
            font-size: 5rem; font-weight: 800; font-style: italic; letter-spacing: -4px;
            background: linear-gradient(to bottom, #fff 30%, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: pulse 4s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.1)); transform: scale(1); } 50% { filter: drop-shadow(0 0 30px rgba(243,207,138,0.4)); transform: scale(1.02); } }

        /* Стеклянные карточки с золотой гранью */
        .glass-card { 
            background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(243, 207, 138, 0.15); border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Прогресс-бар "Magma" */
        .progress-box { height: 14px; background: rgba(0,0,0,0.4); border-radius: 50px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .progress-bar { 
            height: 100%; width: 0%; 
            background: linear-gradient(90deg, var(--wine), #d00, var(--gold)); 
            box-shadow: 0 0 25px rgba(200, 0, 0, 0.5);
            transition: width 2.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Кнопки */
        .btn-luxe { background: #fff; color: #000; border-radius: 25px; font-weight: 800; padding: 24px; text-transform: uppercase; letter-spacing: 3px; font-size: 11px; transition: 0.4s; }
        .btn-luxe:active { transform: scale(0.94) rotate(-1deg); background: var(--gold); }

        .page { position:absolute; inset:0; padding: 40px 30px; display:none; flex-direction:column; justify-content:center; }
        .page.active { display:flex; animation: reveal 0.7s cubic-bezier(0.19, 1, 0.22, 1); }
        @keyframes reveal { from { opacity:0; transform: translateY(20px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }

        input { background: rgba(255,255,255,0.03)!important; border: 1px solid rgba(243,207,138,0.1)!important; color: #fff!important; padding: 22px; border-radius: 25px; outline: none; margin-bottom: 12px; font-size: 16px; }
        input:focus { border-color: var(--gold)!important; background: rgba(255,255,255,0.06)!important; }
    </style>
</head>
<body>
    <div class="bg-glow" id="particles"></div>

    <div class="app">
        <section id="home" class="page active">
            <div class="text-center mb-12">
                <p class="text-[9px] tracking-[1.2em] text-white/20 uppercase font-bold mb-6">Ramadan Kareem • 2026</p>
                <h1 id="adminTrigger" class="brand-title">БЛАГО</h1>
                <p class="text-[10px] tracking-[0.4em] text-gold/60 uppercase mt-4">Premium Charity System</p>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-5">
                <div class="glass-card p-8 text-center border-white/5">
                    <p class="text-[8px] text-white/20 uppercase tracking-[0.3em] mb-2">Raised</p>
                    <p class="text-3xl font-light tracking-tighter" id="raised">0 ₽</p>
                </div>
                <div class="glass-card p-8 text-center border-white/5">
                    <p class="text-[8px] text-white/20 uppercase tracking-[0.3em] mb-2">Iftars</p>
                    <p class="text-3xl font-light tracking-tighter" id="fed">0</p>
                </div>
            </div>

            <div class="glass-card p-10 mb-10">
                <div class="flex justify-between items-end mb-6">
                    <span class="text-5xl font-black tracking-tighter" id="perc">0%</span>
                    <span class="text-[9px] font-bold text-gold uppercase tracking-[0.4em] pb-2">Target 100k</span>
                </div>
                <div class="progress-box">
                    <div id="bar" class="progress-bar"></div>
                </div>
            </div>

            <button onclick="nav('pay')" class="btn-luxe">Внести вклад</button>
        </section>

        <section id="admin" class="page">
            <div class="glass-card p-10">
                <div class="flex justify-between items-center mb-10">
                    <h3 class="text-[10px] font-bold uppercase tracking-[0.5em] text-gold">Control Panel</h3>
                    <button onclick="nav('home')" class="text-white/20 text-3xl">✕</button>
                </div>
                <input type="text" id="aName" placeholder="Имя донора">
                <input type="number" id="aSum" placeholder="Сумма перевода">
                <button onclick="save()" class="btn-luxe !bg-red-950 !text-white !py-5 mb-8 border border-white/10">Добавить запись</button>
                <div id="aList" class="max-h-[200px] overflow-y-auto space-y-4 pr-2 opacity-40 text-[10px] uppercase tracking-widest"></div>
            </div>
        </section>

        <section id="pay" class="page">
            <div class="glass-card p-12 text-center">
                <p class="text-[9px] uppercase tracking-[0.6em] text-white/20 mb-12">Номер для перевода</p>
                <div onclick="copy()" class="bg-white/5 rounded-[35px] p-10 border border-white/5 mb-12 active:scale-95 transition-all">
                    <p class="text-2xl font-bold tracking-[0.1em] text-white" id="card">2200 7019 7567 8803</p>
                    <p id="copyStatus" class="text-[8px] text-gold mt-4 uppercase font-bold tracking-widest opacity-0">Скопировано в буфер</p>
                </div>
                <button onclick="nav('home')" class="btn-luxe mb-6">Готово</button>
                <button onclick="nav('home')" class="text-white/20 text-[9px] uppercase tracking-[0.5em]">Вернуться</button>
            </div>
        </section>
    </div>

    <script>
        const SB_URL = 'https://shvzmhqwsjhdedfifyxg.supabase.co'; 
        const SB_KEY = 'sb_publishable_xv7CxcH5aN4cvVKNQgSxmQ_voz_6TwH'; 
        const _client = supabase.createClient(SB_URL, SB_KEY);
        const GOAL = 100000;

        async function load() {
            const { data, error } = await _client.from('donations').select('*').order('id', {ascending: false});
            if (!error) {
                const total = data.reduce((a, b) => a + (Number(b.s) || 0), 0);
                const perc = Math.min(100, Math.floor((total/GOAL)*100));
                document.getElementById('raised').innerText = total.toLocaleString() + ' ₽';
                document.getElementById('fed').innerText = Math.floor(total/100);
                document.getElementById('perc').innerText = perc + '%';
                document.getElementById('bar').style.width = perc + '%';
                drawAdmin(data);
            }
        }

        async function save() {
            const n = document.getElementById('aName').value;
            const s = parseInt(document.getElementById('aSum').value);
            if(n && s) {
                await _client.from('donations').insert([{ n, s }]);
                document.getElementById('aName').value=''; document.getElementById('aSum').value='';
                load();
            }
        }

        function drawAdmin(data) {
            document.getElementById('aList').innerHTML = data.map(i => `
                <div class="flex justify-between border-b border-white/5 pb-2">
                    <span>${i.n}</span><span>${i.s} ₽</span>
                </div>
            `).join('');
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        let t;
        document.getElementById('adminTrigger').addEventListener('touchstart', () => {
            t = setTimeout(() => { if(prompt('PASSCODE:') === 'FBI002KOLA') nav('admin'); }, 3000);
        });
        document.getElementById('adminTrigger').addEventListener('touchend', () => clearTimeout(t));

        function copy() {
            navigator.clipboard.writeText('2200 7019 7567 8803');
            const s = document.getElementById('copyStatus'); s.style.opacity = '1';
            setTimeout(() => s.style.opacity = '0', 2000);
        }

        // Анимация золотой пыли
        function initParticles() {
            const container = document.getElementById('particles');
            for(let i=0; i<45; i++) {
                const p = document.createElement('div');
                p.className = 'dust';
                const size = Math.random() * 2 + 1 + 'px';
                p.style.width = size; p.style.height = size;
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 8 + 6) + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(p);
            }
        }

        initParticles();
        window.onload = load;
    </script>
</body>
</html>
