<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BLAGO • 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --brand: #ff3b3b; --gold: #d4af37; }
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        body { 
            background: #000; color: #fff; 
            height: 100vh; width: 100vw; 
            overflow: hidden; position: fixed;
        }

        /* Ультра-современный живой фон */
        .app-bg {
            position: fixed; inset: 0; z-index: -1;
            background: #000;
        }
        .bg-glow {
            position: absolute; width: 150vw; height: 100vh;
            top: -50%; left: -25%;
            background: radial-gradient(circle at center, #300 0%, transparent 50%);
            filter: blur(80px);
            animation: drift 15s infinite alternate ease-in-out;
        }
        @keyframes drift { from { transform: translate(-10%, -10%) scale(1); } to { transform: translate(10%, 10%) scale(1.1); } }

        /* Контейнер приложения */
        .app-shell {
            height: 100%; display: flex; flex-direction: column;
            padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        }

        /* Стекло */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px) saturate(1.5);
            -webkit-backdrop-filter: blur(40px) saturate(1.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
        }

        /* Кнопки в стиле iOS */
        .ios-btn {
            background: #fff; color: #000;
            border-radius: 24px; font-weight: 700;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center; justify-content: center;
        }
        .ios-btn:active { transform: scale(0.92); opacity: 0.8; }

        .ios-btn-secondary {
            background: rgba(255,255,255,0.05); color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Секции */
        .page { 
            position: absolute; inset: 0; padding: inherit;
            display: none; flex-direction: column; opacity: 0;
            transform: scale(1.05); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .page.active { display: flex; opacity: 1; transform: scale(1); }

        /* Прогресс-бар */
        .progress-track { height: 8px; background: rgba(255,255,255,0.05); border-radius: 100px; overflow: hidden; }
        .progress-bar { 
            height: 100%; width: 0%; background: linear-gradient(90deg, #600, var(--brand));
            box-shadow: 0 0 20px rgba(255, 59, 59, 0.4);
            transition: width 2s cubic-bezier(0.65, 0, 0.35, 1);
        }

        input {
            background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.1) !important;
            color: #fff !important; width: 100%; padding: 20px; border-radius: 20px; outline: none; font-size: 16px;
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%; animation: shimmer 2s infinite;
        }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    </style>
</head>
<body>
    <div class="app-bg"><div class="bg-glow"></div></div>

    <div class="app-shell">
        <section id="main" class="page active">
            <div class="flex-1 flex flex-col justify-center">
                <div class="text-center mb-12">
                    <p class="text-[10px] tracking-[0.8em] text-white/30 uppercase font-bold mb-4">Ramadan Humanitarian Aid</p>
                    <h1 id="adminTrigger" class="text-7xl font-extrabold tracking-tighter mb-2 transition-all active:scale-95">БЛАГО</h1>
                    <p class="text-white/10 text-xl tracking-widest uppercase font-light">Project 05</p>
                </div>

                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="glass-panel p-6">
                        <p class="text-[10px] uppercase text-white/20 font-bold mb-1">Собрано</p>
                        <p class="text-3xl font-bold tracking-tight" id="raisedVal">0 ₽</p>
                    </div>
                    <div class="glass-panel p-6">
                        <p class="text-[10px] uppercase text-white/20 font-bold mb-1">Накормлено</p>
                        <p class="text-3xl font-bold tracking-tight" id="fedVal">0</p>
                    </div>
                </div>

                <div class="glass-panel p-8">
                    <div class="flex justify-between items-end mb-4">
                        <span class="text-[10px] font-bold text-white/30 uppercase tracking-widest">Прогресс цели</span>
                        <span class="text-3xl font-extrabold" id="percentVal">0%</span>
                    </div>
                    <div class="progress-track mb-2">
                        <div id="barVal" class="progress-bar"></div>
                    </div>
                    <div class="flex justify-between text-[10px] text-white/20 font-bold uppercase">
                        <span>Старт: 0</span>
                        <span>Цель: 100,000</span>
                    </div>
                </div>
            </div>

            <div class="pb-10 space-y-4">
                <button onclick="nav('pay')" class="ios-btn w-full py-6 text-sm uppercase tracking-widest shadow-2xl shadow-white/5">Внести вклад</button>
                <a href="https://instagram.com/blago.project05" target="_blank" class="ios-btn ios-btn-secondary w-full py-5 text-[10px] uppercase tracking-widest">Instagram</a>
            </div>
        </section>

        <section id="pay" class="page">
            <div class="flex-1 flex flex-col justify-center">
                <div class="glass-panel p-10 text-center">
                    <div class="w-16 h-1 w-full bg-white/10 rounded-full mb-10 mx-auto"></div>
                    <h3 class="text-xl font-bold mb-10 tracking-tight">Реквизиты фонда</h3>
                    
                    <div onclick="copy()" class="bg-black/40 rounded-3xl p-8 border border-white/5 mb-8 transition-transform active:scale-95">
                        <p class="text-[9px] text-white/20 font-bold uppercase mb-4 tracking-widest">Карта для перевода</p>
                        <p class="text-2xl font-bold tracking-[0.2em] text-white">2200 7019 7567 8803</p>
                        <p id="copyStatus" class="text-[10px] text-green-500 mt-4 font-bold opacity-0 transition-opacity">СКОПИРОВАНО</p>
                    </div>

                    <button onclick="thanks()" class="ios-btn ios-btn-secondary w-full py-5 text-[10px] uppercase tracking-widest mb-6">Я подтверждаю перевод</button>
                    <button onclick="nav('main')" class="text-xs text-white/20 font-bold uppercase">Вернуться назад</button>
                </div>
            </div>
        </section>

        <section id="admin" class="page">
            <div class="flex-1 flex flex-col pt-10">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-xl font-bold tracking-tight">Панель управления</h2>
                    <button onclick="nav('main')" class="w-10 h-10 glass-panel flex items-center justify-center font-bold">✕</button>
                </div>
                
                <div class="space-y-4 mb-10">
                    <input type="text" id="dName" placeholder="Имя донора">
                    <input type="number" id="dSum" placeholder="Сумма (₽)">
                    <button onclick="add()" class="ios-btn w-full py-5 text-xs uppercase tracking-widest">Добавить данные</button>
                </div>

                <div id="list" class="space-y-3 overflow-y-auto max-h-[400px] pr-2"></div>
            </div>
        </section>
    </div>

    <div id="success" class="fixed inset-0 bg-black/98 backdrop-blur-3xl hidden items-center justify-center z-50 transition-all p-10 text-center" onclick="this.style.display='none'">
        <div>
            <div class="text-6xl mb-6">🌙</div>
            <h2 class="text-5xl font-extrabold italic mb-4 tracking-tighter leading-tight">JAZAKALLAH<br>KHAYRAN</h2>
            <p class="text-white/20 uppercase tracking-[0.3em] text-[10px]">Ваше добро вернется к вам</p>
        </div>
    </div>

    <script>
        const P_KEY = 'FBI002KOLA';
        const TARGET = 100000;
        let store = JSON.parse(localStorage.getItem('blago_2026_final')) || [];

        // Секретный вход: удерживай "БЛАГО" 2 секунды
        let timer;
        const trigger = document.getElementById('adminTrigger');
        trigger.addEventListener('touchstart', () => { timer = setTimeout(() => {
            const p = prompt('SECRET ACCESS:');
            if(p === P_KEY) nav('admin');
        }, 2000); });
        trigger.addEventListener('touchend', () => clearTimeout(timer));

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            setTimeout(() => {
                document.getElementById(id).classList.add('active');
                if(id === 'admin') drawList();
            }, 50);
            update();
        }

        function add() {
            const n = document.getElementById('dName').value;
            const s = parseInt(document.getElementById('dSum').value);
            if(n && s) {
                store.unshift({ id: Date.now(), n, s });
                localStorage.setItem('blago_2026_final', JSON.stringify(store));
                document.getElementById('dName').value = '';
                document.getElementById('dSum').value = '';
                drawList();
                update();
            }
        }

        function del(id) {
            store = store.filter(i => i.id !== id);
            localStorage.setItem('blago_2026_final', JSON.stringify(store));
            drawList();
            update();
        }

        function drawList() {
            document.getElementById('list').innerHTML = store.map(i => `
                <div class="glass-panel p-5 flex justify-between items-center border-white/5">
                    <div>
                        <p class="text-xs font-bold text-white/60 mb-1">${i.n}</p>
                        <p class="text-lg font-bold">${i.s.toLocaleString()} ₽</p>
                    </div>
                    <button onclick="del(${i.id})" class="text-red-500 font-bold p-2 text-xl">✕</button>
                </div>
            `).join('');
        }

        function update() {
            const total = store.reduce((a, b) => a + b.s, 0);
            const perc = Math.min(100, Math.floor((total / TARGET) * 100));
            document.getElementById('raisedVal').innerText = total.toLocaleString() + ' ₽';
            document.getElementById('fedVal').innerText = Math.floor(total / 100).toLocaleString();
            document.getElementById('percentVal').innerText = perc + '%';
            document.getElementById('barVal').style.width = perc + '%';
        }

        function copy() {
            navigator.clipboard.writeText('2200 7019 7567 8803');
            const s = document.getElementById('copyStatus');
            s.style.opacity = '1';
            setTimeout(() => s.style.opacity = '0', 2000);
        }

        function thanks() { document.getElementById('success').style.display = 'flex'; }

        update();
    </script>
</body>
</html>
