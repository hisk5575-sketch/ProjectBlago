<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>БЛАГО | LUXURY EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;800&display=swap" rel="stylesheet">
    <style>
        /* ТВОЯ ПАЛИТРА */
        :root { 
            --gold: #d4af37;      /* Матовое золото */
            --burgundy: #630d0d;  /* Глубокий бордовый */
            --dark: #080808;      /* Чистый черный */
            --white: #ffffff;     /* Белый */
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color:transparent; }
        body { background: var(--dark); color: var(--white); height: 100vh; overflow: hidden; position: fixed; width: 100vw; }

        /* Фон с бордовым свечением */
        .art-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at 50% -20%, #2a0505 0%, var(--dark) 100%); }
        .mesh { position: absolute; inset: 0; opacity: 0.1; background-image: radial-gradient(var(--gold) 0.5px, transparent 0.5px); background-size: 40px 40px; }

        /* Полумесяцы и звезды (Золото) */
        .obj { position: absolute; pointer-events: none; color: var(--gold); filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5)); animation: floatUp linear forwards; opacity: 0; }
        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(15deg); opacity: 0; }
        }

        /* Заголовок (Белый + Золото) */
        .title-glow { background: linear-gradient(135deg, var(--white) 0%, var(--gold) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2)); }

        /* Карточки (Стеклянный белый) */
        .card-glass { background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 40px; }
        
        /* Шкала (Бордовый + Золото) */
        .bar-wrap { height: 12px; background: rgba(0,0,0,0.5); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        .bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, var(--burgundy), #a00, var(--gold)); box-shadow: 0 0 20px rgba(99, 13, 13, 0.6); transition: width 3s cubic-bezier(0.19, 1, 0.22, 1); }

        /* Кнопка (Белая) */
        .btn-main { background: var(--white); color: var(--dark); border-radius: 30px; font-weight: 800; padding: 24px; width: 100%; text-transform: uppercase; letter-spacing: 3px; font-size: 12px; transition: 0.3s; }
        .btn-main:active { transform: scale(0.95); background: var(--gold); }

        .page { position:absolute; inset:0; padding:env(safe-area-inset-top) 30px env(safe-area-inset-bottom); display:none; flex-direction:column; justify-content:center; }
        .page.active { display:flex; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        input { background: rgba(255,255,255,0.05)!important; border: 1px solid rgba(255,255,255,0.1)!important; color: #fff!important; padding: 22px; border-radius: 25px; outline: none; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="art-bg"><div class="mesh"></div></div>

    <div class="app">
        <section id="home" class="page active">
            <div class="text-center mb-12">
                <p class="text-[9px] tracking-[1em] text-white/30 uppercase mb-4">Ramadan Kareem 2026</p>
                <h1 id="adminTrigger" class="text-7xl font-extrabold italic tracking-tighter title-glow">БЛАГО</h1>
                <p class="text-[10px] tracking-[0.4em] uppercase mt-3 text-white/40">Premium Social Project</p>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
                <div class="card-glass p-8 text-center border-white/5">
                    <p class="text-[8px] text-white/20 uppercase tracking-[0.4em] mb-2">Собрано</p>
                    <p class="text-3xl font-light" id="raised">0 ₽</p>
                </div>
                <div class="card-glass p-8 text-center border-white/5">
                    <p class="text-[8px] text-white/20 uppercase tracking-[0.4em] mb-2">Ифтары</p>
                    <p class="text-3xl font-light" id="fed">0</p>
                </div>
            </div>

            <div class="card-glass p-10 mb-10">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[10px] font-bold text-burgundy uppercase tracking-widest">Progress</span>
                    <span class="text-4xl font-black tracking-tighter" id="perc">0%</span>
                </div>
                <div class="bar-wrap">
                    <div id="bar" class="bar-inner"></div>
                </div>
                <p class="text-[9px] text-white/20 mt-6 text-center uppercase tracking-[0.5em]">Цель: 100,000 Рублей</p>
            </div>

            <button onclick="nav('pay')" class="btn-main shadow-xl shadow-white/5">Внести вклад</button>
        </section>

        <section id="admin" class="page">
            <div class="card-glass p-10">
                <div class="flex justify-between mb-10 items-center">
                    <h3 class="text-xs uppercase tracking-widest text-gold font-bold">Управление</h3>
                    <button onclick="nav('home')" class="text-2xl">✕</button>
                </div>
                <input type="text" id="aName" placeholder="Имя донора">
                <input type="number" id="aSum" placeholder="Сумма">
                <button onclick="save()" class="btn-main !bg-burgundy !text-white !py-5 mb-8">Записать</button>
                <div id="aList" class="max-h-[200px] overflow-y-auto space-y-3 opacity-40"></div>
            </div>
        </section>

        <section id="pay" class="page">
            <div class="card-glass p-12 text-center">
                <h3 class="text-[9px] uppercase tracking-[0.5em] text-white/30 mb-12">Номер карты</h3>
                <div onclick="copy()" class="mb-12 group">
                    <p class="text-2xl font-bold tracking-widest mb-4 transition-all group-active:scale-90" id="card">2200 7019 7567 8803</p>
                    <p id="copyStatus" class="text-[9px] text-gold uppercase tracking-widest opacity-0">Скопировано</p>
                </div>
                <button onclick="nav('home')" class="btn-main mb-6">Готово</button>
                <button onclick="nav('home')" class="text-white/20 text-[9px] uppercase tracking-widest">Назад</button>
            </div>
        </section>
    </div>

    <script>
        // ДАННЫЕ ИЗ SUPABASE (ТВОИ КЛЮЧИ ПРОВЕРЕНЫ)
        const SB_URL = 'https://shvzmhqwsjhdedfifyxg.supabase.co'; 
        const SB_KEY = 'sb_publishable_xv7CxcH5aN4cvVKNQgSxmQ_voz_6TwH'; 
        const _client = supabase.createClient(SB_URL, SB_KEY);
        const GOAL = 100000;

        async function load() {
            const { data, error } = await _client.from('donations').select('*').order('id', {ascending: false});
            if (!error) {
                const total = data.reduce((a, b) => a + (Number(b.s) || 0), 0);
                const perc = Math.min(100, Math.floor((total/GOAL)*100));
                document.getElementById('raised').innerText = total.toLocaleString() + ' ₽';
                document.getElementById('fed').innerText = Math.floor(total/100);
                document.getElementById('perc').innerText = perc + '%';
                document.getElementById('bar').style.width = perc + '%';
                drawAdmin(data);
            }
        }

        async function save() {
            const n = document.getElementById('aName').value;
            const s = parseInt(document.getElementById('aSum').value);
            if(n && s) {
                await _client.from('donations').insert([{ n, s }]);
                document.getElementById('aName').value=''; document.getElementById('aSum').value='';
                load();
            }
        }

        function drawAdmin(data) {
            document.getElementById('aList').innerHTML = data.map(i => `
                <div class="flex justify-between text-[10px] border-b border-white/5 pb-2 uppercase tracking-widest">
                    <span>${i.n}</span><span>${i.s} ₽</span>
                </div>
            `).join('');
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        let t;
        document.getElementById('adminTrigger').addEventListener('touchstart', () => {
            t = setTimeout(() => { if(prompt('ENTRY CODE:') === 'FBI002KOLA') nav('admin'); }, 3000);
        });
        document.getElementById('adminTrigger').addEventListener('touchend', () => clearTimeout(t));

        function copy() {
            navigator.clipboard.writeText('2200 7019 7567 8803');
            const s = document.getElementById('copyStatus'); s.style.opacity = '1';
            setTimeout(() => s.style.opacity = '0', 2000);
        }

        // ПРЕМИУМ АНИМАЦИЯ (Золото)
        function spawn() {
            const icons = ['☾', '✦', '★'];
            const s = document.createElement('div');
            s.className = 'obj';
            s.innerText = icons[Math.floor(Math.random()*icons.length)];
            s.style.left = Math.random() * 100 + 'vw';
            s.style.fontSize = (Math.random() * 20 + 15) + 'px';
            s.style.animationDuration = (Math.random() * 5 + 7) + 's';
            document.body.appendChild(s);
            setTimeout(() => s.remove(), 10000);
        }

        setInterval(spawn, 1000);
        window.onload = load;
    </script>
</body>
</html>
